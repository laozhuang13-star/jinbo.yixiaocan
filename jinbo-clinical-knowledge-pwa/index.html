<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="锦波智库">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <title>锦波智库</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    body{display:flex;align-items:center;justify-content:center;background:#fff;color:#263238}
    main{text-align:center;padding:28px}img{width:112px;height:112px;object-fit:contain}
    p{margin:18px 0 8px;font-size:18px;font-weight:600}small{color:#718096}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="锦波智库">
    <p>正在进入锦波智库…</p>
    <small>如果没有自动跳转，请点击下方链接</small>
    <p><a href="https://jinbo.yixiaocan.cn">打开锦波智库</a></p>
  </main>
  <script>
    const TARGET_URL = "https://jinbo.yixiaocan.cn";
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
    }
    setTimeout(() => { window.location.replace(TARGET_URL); }, 700);
  </script>
</body>
</html>
